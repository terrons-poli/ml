name: Python and notebook checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: Black formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Black with notebook support
        run: python -m pip install 'black[jupyter]==26.10.1'

      - name: Check Python and notebook formatting
        run: python -m black --check --diff .

  notebook-outputs:
    name: Notebook outputs cleared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install nbstripout
        run: python -m pip install nbstripout==0.9.1

      - name: Check notebooks have no saved computations
        # NUL separators handle spaces in filenames; -r skips an empty file list.
        run: git ls-files -z -- '*.ipynb' | xargs -0 -r nbstripout --verify
